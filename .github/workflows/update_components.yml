name: Update Nasdaq-100 Constituents

on:
  schedule:
    - cron: "0 0 * * 0"   # Every Sunday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Update Nasdaq-100 constituents
        run: python update_components.py
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ndx_components.py backup_ndx/ update_ndx.log
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
          else
            git commit -m "chore: auto-update Nasdaq-100 constituents $(date +'%Y-%m-%d')"
            git push
          fi
