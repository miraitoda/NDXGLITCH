name: 更新成分股

on:
  schedule:
    # 每周日 UTC 0:00 = 北京时间 8:00
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: |
          pip install requests

      - name: 更新 Nasdaq-100 成分股及权重
        run: python update_components.py

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ndx_components.py backup_ndx/ update_ndx.log
          if git diff --staged --quiet; then
            echo "✅ 无变化，无需提交"
          else
            git commit -m "chore: 自动更新 Nasdaq-100 成分股权重 $(date +'%Y-%m-%d')"
            git push
          fi
